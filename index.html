<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Illuminate</title>
  <meta name="description" content="Illuminate: a scrollytelling editor for journalism students.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/editor/editor.css">
  <script src="runtime/illuminate-runtime.js"></script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#inspector">Skip to inspector</a>

  <header class="app-header">
    <h1 class="app-title">Illuminate</h1>
    <div class="toolbar">
      <div class="menu-wrap">
        <button type="button" class="btn" id="file" aria-expanded="false" aria-controls="file-menu">File &amp; Export <span aria-hidden="true">▾</span></button>
        <ul class="menu" id="file-menu" hidden>
          <li><button type="button" class="menu-option" id="new-story"><strong>New story</strong></button></li>
          <li><button type="button" class="menu-option" id="open"><strong>Open…</strong><span>A ZIP or web page exported from Illuminate</span></button></li>
          <li class="menu-sep" role="separator"></li>
        </ul>
      </div>
      <button type="button" class="btn btn-quiet btn-icon" id="undo" aria-label="Undo" title="Undo (Ctrl/Cmd+Z)" aria-keyshortcuts="Control+Z Meta+Z" disabled><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button type="button" class="btn btn-quiet btn-icon" id="redo" aria-label="Redo" title="Redo (Ctrl/Cmd+Shift+Z)" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z Control+Y" disabled><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <span class="toolbar-sep" aria-hidden="true"></span>
      <button type="button" class="btn" id="checks" aria-expanded="false" aria-controls="checks-panel">Checks <span class="count"></span></button>
      <button type="button" class="btn" id="preview-show" hidden>Show preview</button>
    </div>
    <div class="status-lines">
      <p class="app-status" id="app-status">Loading editor…</p>
      <div class="folder-line">
        <div class="menu-wrap" id="folder-wrap" hidden>
          <button type="button" class="link-button" id="folder" aria-controls="folder-menu">Save to folder…</button>
          <ul class="menu menu-right" id="folder-menu" hidden></ul>
        </div>
        <p class="app-status" id="folder-status"></p>
      </div>
      <p class="app-status" id="export-status"></p>
    </div>
  </header>

  <noscript>
    <p class="noscript">Illuminate needs JavaScript turned on to edit stories.</p>
  </noscript>

  <main class="app-main" id="app">
    <section class="panel panel-blocks" id="blocks" aria-labelledby="blocks-heading">
      <h2 id="blocks-heading" class="panel-heading">Blocks</h2>
    </section>

    <section class="panel panel-inspector" id="inspector" tabindex="-1" aria-labelledby="inspector-heading">
      <h2 id="inspector-heading" class="panel-heading">Inspector</h2>
    </section>

    <section class="panel panel-preview" id="preview-panel" aria-labelledby="preview-heading">
      <div class="preview-bar">
        <h2 id="preview-heading" class="panel-heading">Preview</h2>
        <div class="preview-controls">
          <div class="preview-widths" role="group" aria-label="Preview width">
            <button type="button" class="btn-slim" data-preview-width="desktop" aria-pressed="true">Desktop</button>
            <button type="button" class="btn-slim" data-preview-width="phone" aria-pressed="false">Phone</button>
          </div>
          <button type="button" class="btn-slim" id="preview-popout" title="Open live preview in a new tab">New tab <span aria-hidden="true">↗</span></button>
          <button type="button" class="btn-slim" id="preview-hide" aria-controls="preview-panel" title="Hide inline preview to widen the editor">Hide</button>
        </div>
      </div>
      <div class="preview-stage">
        <iframe id="preview-frame" class="preview-frame" title="Preview of your story"></iframe>
      </div>
    </section>

    <aside class="panel checks-panel" id="checks-panel" tabindex="-1" aria-labelledby="checks-heading" hidden></aside>
  </main>

  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <div id="toasts" class="toast-region" aria-live="polite"></div>
  <dialog id="choice-dialog" class="choice-dialog"></dialog>
</body>
</html>
